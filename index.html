<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Game</title>
    <style>
        body { background-color: #e6e6fa; font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        h1 { color: #4a0e4e; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-width: 350px; margin: 20px auto; }
        .cell { background: #fff; padding: 15px 0; font-size: 18px; font-weight: bold; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; }
        .cell.marked { background: #ff4500; color: #fff; }
    </style>
</head>
<body>

    <h1>Bingo Game</h1>
    <p>ቁጥር ይምረጡ</p>

    <div class="grid" id="bingoGrid"></div>

    <script>
        const grid = document.getElementById('bingoGrid');
        for (let i = 1; i <= 25; i++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            cell.innerText = i;
            cell.onclick = () => cell.classList.toggle('marked');
            grid.appendChild(cell);
        }
    </script>

</body>
</html>
